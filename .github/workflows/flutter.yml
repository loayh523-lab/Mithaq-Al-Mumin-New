name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project files
        run: flutter create --platforms=android --project-name=mithaq_al_mumin .
      - name: Enable internet permission for Quran text
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text(encoding="utf-8")
          permission = '    <uses-permission android:name="android.permission.INTERNET" />'
          if "android.permission.INTERNET" not in content:
              marker = "<application"
              position = content.find(marker)
              if position < 0:
                  raise SystemExit("Android application tag was not found")
              content = content[:position] + permission + "\n    " + content[position:]
              manifest.write_text(content, encoding="utf-8")
          PY
      - name: Prepare full offline Quran text
        run: python3 tool/prepare_quran.py
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mithaq-al-mumin-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
