name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Only one CI run per PR or branch; newer commits replace stale or stalled runs.
  group: flutter-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project files
        run: flutter create --platforms=android --project-name=mithaq_al_mumin .
      - name: Configure Android notification scheduling
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text(encoding="utf-8")
          permissions = [
              '    <uses-permission android:name="android.permission.INTERNET" />',
              '    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />',
              '    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />',
              '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />',
              '    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />',
              '    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />',
              '    <uses-permission android:name="android.permission.VIBRATE" />',
          ]
          marker = "<application"
          position = content.find(marker)
          if position < 0:
              raise SystemExit("Android application tag was not found")
          for permission in permissions:
              name = permission.split('"')[1]
              if name not in content:
                  position = content.find(marker)
                  content = content[:position] + permission + "\n    " + content[position:]

          receivers = '''    <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" />
              <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">
                  <intent-filter>
                      <action android:name="android.intent.action.BOOT_COMPLETED"/>
                      <action android:name="android.intent.action.MY_PACKAGE_REPLACED"/>
                      <action android:name="android.intent.action.QUICKBOOT_POWERON" />
                      <action android:name="com.htc.intent.action.QUICKBOOT_POWERON"/>
                  </intent-filter>
              </receiver>
          '''
          if "ScheduledNotificationBootReceiver" not in content:
              end = content.rfind("</application>")
              if end < 0:
                  raise SystemExit("Android application closing tag was not found")
              content = content[:end] + receivers + "\n    " + content[end:]
          content = re.sub(r'android:label="[^"]*"', 'android:label="ميثاق المؤمن"', content, count=1)
          manifest.write_text(content, encoding="utf-8")

          gradle = Path("android/app/build.gradle.kts")
          build = gradle.read_text(encoding="utf-8")
          if "isCoreLibraryDesugaringEnabled = true" not in build:
              build = build.replace("compileOptions {", "compileOptions {\n        isCoreLibraryDesugaringEnabled = true", 1)
          dependency = 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")'
          if dependency not in build:
              if "dependencies {" in build:
                  build = build.replace("dependencies {", "dependencies {\n    " + dependency, 1)
              else:
                  build += "\n\ndependencies {\n    " + dependency + "\n}\n"
          gradle.write_text(build, encoding="utf-8")
          PY
      - name: Prepare bundled adhan sound for Android notifications
        run: python3 tool/prepare_adhan.py
      - name: Prepare full offline Quran text
        run: python3 tool/prepare_quran.py
      - name: Prepare offline Shia duas and ziyarat
        run: python3 tool/prepare_shia_duas.py
      - name: Prepare offline Nahj al-Balagha
        run: python3 tool/prepare_nahj.py
      - name: Install dependencies
        run: flutter pub get
      - name: Generate Arabic launcher icon
        run: dart run flutter_launcher_icons

      - name: Analyze
        run: flutter analyze
      # Publish the APK before the full test suite so a slow widget test cannot
      # prevent the user from obtaining a build that passed static analysis.
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mithaq-al-mumin-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
      # Build an optimized 64-bit APK for modern Android phones as well as the debug build.
      - name: Build optimized Android APK (arm64)
        run: flutter build apk --release --target-platform android-arm64
      - name: Upload optimized Android APK
        uses: actions/upload-artifact@v4
        with:
          name: mithaq-al-mumin-android-arm64-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
      - name: Test
        timeout-minutes: 8
        run: flutter test --timeout 3m --reporter expanded
