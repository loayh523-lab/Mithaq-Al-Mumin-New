name: Flutter CI — Analyze, Test, Android Release Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Cancel stale runs on the same branch so each commit is validated against
# the current tree instead of consuming runners with obsolete APK builds.
concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate Python build scripts
        run: python3 -m compileall -q tool
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project files
        run: flutter create --platforms=android --project-name=mithaq_al_mumin .
      - name: Configure generated Android project
        run: python3 tool/prepare_android_project.py
      - name: Generate the redesigned Mithaq vector launcher icon
        run: python3 tool/prepare_android_branding.py
      - name: Prepare licensed adhan sound and offline playback asset
        run: python3 tool/prepare_adhan.py
      - name: Prepare full offline Quran text
        run: python3 tool/prepare_quran.py
      - name: Prepare offline Quran juz and hizb metadata
        run: python3 tool/prepare_quran_metadata.py
      - name: Prepare offline Shia duas and ziyarat
        run: python3 tool/prepare_shia_duas.py
      - name: Prepare licensed Arabic fonts
        run: python3 tool/prepare_fonts.py
      - name: Validate bundled Arabic text and reject Persian characters
        run: python3 tool/check_arabic_assets.py
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build Android release APK for validation
        run: flutter build apk --release
      - name: Report release APK size for the completeness budget
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          BYTES="$(stat -c '%s' "$APK")"
          MIB="$(awk -v bytes="$BYTES" 'BEGIN { printf "%.2f", bytes / 1048576 }')"
          SHA256="$(sha256sum "$APK" | cut -d ' ' -f 1)"
          echo "Release APK: $MIB MiB ($BYTES bytes)"
          echo "SHA-256: $SHA256"
          {
            echo "### Android release build size"
            echo "- APK size: $MIB MiB ($BYTES bytes)"
            echo "- SHA-256: `$SHA256`"
            echo "- Size budget: warn above 80 MiB; keep the full Shia feature set."
          } >> "$GITHUB_STEP_SUMMARY"
          if (( BYTES > 80 * 1024 * 1024 )); then
            echo "::warning::Release APK exceeds the 80 MiB review threshold. Inspect bundled assets before adding more large files."
          fi
      # The previous artifact was unsigned and Android rejected it at install time.
      # This temporary validation certificate makes the APK installable; it is not
      # a production signing key and must never be used for public distribution.
      - name: Sign validation APK for Android installation
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          KEYSTORE="$RUNNER_TEMP/mithaq-validation.keystore"
          keytool -genkeypair -v \
            -keystore "$KEYSTORE" \
            -storepass android \
            -keypass android \
            -alias validation \
            -dname "CN=Mithaq Al-Mumin Validation" \
            -keyalg RSA -keysize 2048 -validity 3650 -noprompt
          BUILD_TOOLS_VERSION="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V | tail -n 1)"
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner"
          test -x "$APKSIGNER"
          "$APKSIGNER" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias validation \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out "$RUNNER_TEMP/app-release-signed.apk" \
            "$APK"
          "$APKSIGNER" verify --verbose --print-certs "$RUNNER_TEMP/app-release-signed.apk"
          mv "$RUNNER_TEMP/app-release-signed.apk" "$APK"
      - name: Upload installable validation APK
        uses: actions/upload-artifact@v4
        with:
          name: mithaq-al-mumin-validation-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
