name: mithaq_al_mumin
description: تطبيق ميثاق المؤمن
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3
  http: ^1.3.0
  flutter_compass: ^0.8.1
  geolocator: ^14.0.2
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1
  geomag: ^0.3.0
  audioplayers: ^6.5.1
  share_plus: ^13.3.1
  url_launcher: ^6.3.2
  wakelock_plus: 1.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/quran/chapters.json
    - assets/quran/uthmani_surahs.json
    - assets/quran/verse_metadata.json
    - assets/shia_duas/shia_duas.json
    - assets/audio/adhan_shabbar_maalla.mp3
